<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todo.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Document</title>
</head>

<body>

    <div class="container" id="container">
        <div class="titre" id="titre">Todo List</div>
        <div class="entrer">
            <div>
                <span>Titre*:</span>

                <input type="text" id="inp" placeholder="Ajouter une tâche">
            </div>

            <div class="error" id="error"></div>

            <div>
                <span>Description:</span>
                <input type="textarea" class="description" id="description" placeholder="description">
            </div>
            <div class="error" id="error1"></div>


            <button class="btn" id="btn">+</button>
        </div>

        <div class="form">
            <div class="checkbi">
                <input type="checkbox" name="toutSelec" id="toutSelec" class="toutSelect">
                <label for="toutSelec" class="tlt">Toutes les taches</label>
            </div>
            <div class="suppAll" id="suppAll">x</div>
        </div>

        <div class="liste" id="liste">
            <ul></ul>
        </div>
    </div>
    <script type="module" src="./todo.js"></script>
</body>

</html>
